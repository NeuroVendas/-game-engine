name: Deploy Forge Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-preview-v05
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check
      - run: npm run build

      - name: Stamp source revision for deployment verification
        run: printf '%s\n' "$GITHUB_SHA" > dist/revision.txt

      - name: Publish dist to forge-preview branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b forge-preview-v05
          git add -A
          git commit -m "Forge v0.5 preview"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin forge-preview-v05
