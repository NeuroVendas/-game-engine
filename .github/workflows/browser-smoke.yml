name: Forge Browser Smoke

on:
  push:
    branches:
      - forge-v0.4
      - forge-v0.5
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"

concurrency:
  group: forge-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
