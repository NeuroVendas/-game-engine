name: Forge Cloud Smoke

on:
  push:
    branches:
      - forge-v0.4
      - forge-v0.5
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: [main]

jobs:
  cloud-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:cloud
