name: Forge CI

on:
  push:
    branches:
      - main
      - "forge-v*"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"

concurrency:
  group: forge-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
