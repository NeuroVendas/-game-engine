name: Forge v0.5.0 Official Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v05.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Verify build and publish v0.5.0
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Validate scenes and types
        run: npm run check
      - name: Build production bundle
        run: npm run build
      - name: Verify cloud integration smoke tests
        run: npm run test:cloud
      - name: Verify version
        run: |
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (p.version !== "0.5.0") process.exit(1)'
          test -s dist/index.html
      - name: Publish immutable v0.5.0 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.5.0 release already exists; preserving it."
          else
            gh release create v0.5.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Forge =] v0.5.0" \
              --notes-file docs/releases/v0.5.0.md \
              --latest
          fi
